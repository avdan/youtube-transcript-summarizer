<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>YouTube Summary</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      width: 420px;
      min-height: 420px;
      max-height: 600px;
      margin: 0;
      overflow-y: auto;
      color: #202124;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
    }

    .container {
      padding: 14px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e7e9ee;
    }

    .title {
      margin: 0;
      font-size: 17px;
      font-weight: 650;
      line-height: 1.2;
    }

    .settings-btn,
    .icon-btn,
    .primary-btn,
    .secondary-btn {
      border-radius: 6px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .settings-btn,
    .icon-btn,
    .secondary-btn {
      color: #2f343d;
      background: #ffffff;
      border: 1px solid #d5d9e2;
    }

    .settings-btn {
      padding: 6px 10px;
      font-size: 12px;
    }

    .primary-btn {
      padding: 8px 14px;
      color: #ffffff;
      background: #cc1f1a;
      border: 1px solid #cc1f1a;
    }

    .secondary-btn,
    .icon-btn {
      padding: 7px 10px;
      font-size: 12px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    #content {
      padding-top: 14px;
    }

    .state {
      display: flex;
      min-height: 300px;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      text-align: center;
      color: #525967;
    }

    .state h2 {
      margin: 0;
      color: #202124;
      font-size: 16px;
    }

    .state p {
      max-width: 300px;
      margin: 0;
      line-height: 1.45;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid #eceff4;
      border-top-color: #cc1f1a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error {
      width: 100%;
      padding: 12px;
      color: #8f1d18;
      background: #fff1f0;
      border: 1px solid #f3c4c0;
      border-radius: 6px;
      text-align: left;
      line-height: 1.45;
    }

    .video-block {
      padding-bottom: 12px;
      border-bottom: 1px solid #eceff4;
    }

    .video-block h2 {
      display: -webkit-box;
      margin: 0 0 4px;
      overflow: hidden;
      color: #202124;
      font-size: 14px;
      line-height: 1.35;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .video-block p {
      margin: 0;
      overflow: hidden;
      color: #687080;
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .summary-section,
    .qa-section {
      padding-top: 14px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    h3 {
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      color: #202124;
    }

    .inline-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .summary-content {
      max-height: none;
      margin: 0;
      padding: 12px;
      overflow: visible;
      color: #202124;
      background: #f7f8fa;
      border: 1px solid #e7e9ee;
      border-radius: 6px;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.5;
    }

    .chat-container {
      max-height: 220px;
      margin: 10px 0;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user-message {
      margin-left: 44px;
      background: #eef4ff;
    }

    .assistant-message {
      margin-right: 44px;
      background: #f4f5f7;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .model-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .model-label {
      flex-shrink: 0;
      color: #525967;
      font-size: 12px;
      font-weight: 600;
    }

    .model-select {
      flex: 1;
      min-width: 0;
      padding: 6px 8px;
      color: #202124;
      background: #ffffff;
      border: 1px solid #d5d9e2;
      border-radius: 6px;
      font: inherit;
      font-size: 12px;
    }

    .question-input {
      min-width: 0;
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #d5d9e2;
      border-radius: 6px;
      font: inherit;
    }

    .question-input:focus {
      border-color: #cc1f1a;
      outline: none;
      box-shadow: 0 0 0 2px rgba(204, 31, 26, 0.12);
    }

    .update-banner {
      display: none;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
      padding: 8px 10px;
      color: #1f3b8a;
      background: #eef4ff;
      border: 1px solid #c7d6f5;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.4;
    }

    .update-banner.visible {
      display: flex;
    }

    .update-banner .update-text {
      flex: 1;
      min-width: 0;
    }

    .update-banner a {
      color: #1f3b8a;
      font-weight: 600;
      text-decoration: underline;
    }

    .update-banner button {
      padding: 4px 8px;
      color: #1f3b8a;
      background: transparent;
      border: 1px solid #c7d6f5;
      border-radius: 4px;
      font: inherit;
      font-size: 11px;
      cursor: pointer;
    }

    .update-banner button:hover {
      background: #dbe6fb;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="title">YouTube Summary</h1>
      <button class="settings-btn" id="settingsBtn" type="button">Settings</button>
    </header>
    <div class="update-banner" id="updateBanner">
      <span class="update-text">
        Update available:
        <a id="updateLink" href="#" target="_blank" rel="noopener noreferrer">v<span id="updateVersion"></span></a>
      </span>
      <button id="updateDismissBtn" type="button">Dismiss</button>
    </div>
    <main id="content"></main>
  </div>
  <script src="popup.js"></script>
</body>
</html>
